[package]
name = "hypervpn"
version = "2.0.2"
description = "HyperVPN - Fast, native VLESS desktop VPN client for Windows"
authors = ["HyperVPN Team"]
edition = "2021"

[lib]
name = "hypervpn_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
url = "2.5"
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs-next = "2.0"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# Windows-specific system crates if needed
